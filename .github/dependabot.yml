# Dependabot: watch for new GitHub Actions releases and open PRs that
# bump the pinned commit SHA (and the accompanying `# vX.Y.Z` comment).
version: 2
updates:
  - package-ecosystem: github-actions
    # Composite actions under timing/ pin actions too; "/" alone only scans
    # .github/workflows.
    directories:
      - /
      - /timing/*
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # Lint tools used by lint.yml.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      lint-tools:
        patterns:
          - "*"
