name: build-image-and-dispatch

on:
  workflow_call:
    inputs:
      app:
        description: "App name in the deployment repository"
        type: string
        required: true
      environment:
        description: "Deployment environment to update"
        type: string
        default: "dev"
      deployment-owner:
        description: "Owner of the repository that receives the deploy-image repository_dispatch"
        type: string
        default: "slaclab"
      deployment-repo:
        description: "Repository that receives the deploy-image repository_dispatch"
        type: string
        default: "swapps-deployment"
      deploy-ref:
        description: "Git ref that is allowed to push and dispatch deployments"
        type: string
        default: "refs/heads/main"
      image-name:
        description: "GHCR image name without registry; defaults to the calling repository"
        type: string
        default: ""
      dockerfile:
        description: "Dockerfile path passed to docker/build-push-action"
        type: string
        default: "Dockerfile"
      context:
        description: "Build context passed to docker/build-push-action"
        type: string
        default: "."
      platforms:
        description: "Target platform list passed to docker/build-push-action"
        type: string
        default: "linux/amd64"
      setup-qemu:
        description: "Install QEMU before Buildx, usually needed for multi-arch builds"
        type: boolean
        default: false
      sha-tag-prefix:
        description: "Prefix for the SHA tag, for example 'sha-', 'main-', or ''"
        type: string
        default: "sha-"
      latest-tag:
        description: "Also publish latest when the deployment ref is pushed"
        type: boolean
        default: true
      extra-tags:
        description: "Additional docker/metadata-action tag rules"
        type: string
        default: ""
      labels:
        description: "Additional docker/metadata-action labels"
        type: string
        default: ""
      build-args:
        description: "Newline-separated Docker build args"
        type: string
        default: ""
      target:
        description: "Optional Docker build target"
        type: string
        default: ""
      provenance:
        description: "Provenance setting passed to docker/build-push-action"
        type: string
        default: ""
      cache-from:
        description: "Docker build cache source"
        type: string
        default: "type=gha"
      cache-to:
        description: "Docker build cache destination"
        type: string
        default: "type=gha,mode=max"
    secrets:
      APP_ID:
        description: "GitHub App ID with access to the deployment repository"
        required: false
      APP_PRIVATE_KEY:
        description: "GitHub App private key with access to the deployment repository"
        required: false
    outputs:
      image:
        description: "Full image reference dispatched to the deployment repository"
        value: ${{ jobs.build_and_dispatch.outputs.image }}

jobs:
  build_and_dispatch:
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.deploy_image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment secrets
        if: github.ref == inputs.deploy-ref && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APP_ID" || { echo "::error::APP_ID is required to dispatch deployments"; exit 1; }
          test -n "$APP_PRIVATE_KEY" || { echo "::error::APP_PRIVATE_KEY is required to dispatch deployments"; exit 1; }

      - name: Set image reference
        id: image
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
          SHA_TAG_PREFIX: ${{ inputs.sha-tag-prefix }}
        run: |
          set -euo pipefail
          image_name="${INPUT_IMAGE_NAME:-$GITHUB_REPOSITORY}"
          image_name=$(printf '%s' "$image_name" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${image_name}"
          deploy_image="${image}:${SHA_TAG_PREFIX}${GITHUB_SHA::7}"
          {
            echo "image=${image}"
            echo "deploy_image=${deploy_image}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: inputs.setup-qemu
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.ref == inputs.deploy-ref && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=sha,prefix=${{ inputs.sha-tag-prefix }}
            type=raw,value=latest,enable=${{ inputs.latest-tag }}
            ${{ inputs.extra-tags }}
          labels: ${{ inputs.labels }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.ref == inputs.deploy-ref && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          target: ${{ inputs.target }}
          provenance: ${{ inputs.provenance }}
          cache-from: ${{ inputs.cache-from }}
          cache-to: ${{ inputs.cache-to }}

      - name: Mint deployment repo token
        if: github.ref == inputs.deploy-ref && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ inputs.deployment-owner }}
          repositories: ${{ inputs.deployment-repo }}

      - name: Dispatch deploy
        if: github.ref == inputs.deploy-ref && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP: ${{ inputs.app }}
          ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_OWNER: ${{ inputs.deployment-owner }}
          DEPLOYMENT_REPO: ${{ inputs.deployment-repo }}
          IMAGE: ${{ steps.image.outputs.deploy_image }}
        run: |
          set -euo pipefail
          gh api "repos/${DEPLOYMENT_OWNER}/${DEPLOYMENT_REPO}/dispatches" \
            -f event_type=deploy-image \
            -f "client_payload[app]=${APP}" \
            -f "client_payload[environment]=${ENVIRONMENT}" \
            -f "client_payload[image]=${IMAGE}"
