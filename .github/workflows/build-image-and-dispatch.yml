name: build-image-and-dispatch

on:
  workflow_call:
    inputs:
      app:
        description: "App name in slaclab/swapps-deployment"
        type: string
        required: true
      environment:
        description: "Deployment environment to update"
        type: string
        default: "dev"
      deployment-owner:
        description: "Owner of the repository that receives the deploy-image repository_dispatch"
        type: string
        default: ""
      deployment-repo:
        description: "Repository that receives the deploy-image repository_dispatch"
        type: string
        default: "swapps-deployment"
      deploy-ref:
        description: "Git ref that is allowed to push and dispatch deployments"
        type: string
        default: "refs/heads/main"
      image-name:
        description: "GHCR image name without registry; defaults to the calling repository"
        type: string
        default: ""
      dockerfile:
        description: "Dockerfile path passed to docker/build-push-action"
        type: string
        default: "Dockerfile"
      context:
        description: "Build context passed to docker/build-push-action"
        type: string
        default: "."
      platforms:
        description: "Target platform list passed to docker/build-push-action"
        type: string
        default: "linux/amd64"
      setup-qemu:
        description: "Install QEMU before Buildx, usually needed for multi-arch builds"
        type: boolean
        default: false
      sha-tag-prefix:
        description: "Prefix for the SHA tag, for example 'sha-', 'main-', or ''"
        type: string
        default: "sha-"
      latest-tag:
        description: "Also tag deployment-ref builds as latest"
        type: boolean
        default: true
      extra-tags:
        description: "Additional docker/metadata-action tag rules"
        type: string
        default: ""
      labels:
        description: "Additional docker/metadata-action labels"
        type: string
        default: ""
      build-args:
        description: "Newline-separated Docker build args"
        type: string
        default: ""
      target:
        description: "Optional Docker build target"
        type: string
        default: ""
      provenance:
        description: "Provenance setting passed to docker/build-push-action"
        type: string
        default: ""
      cache-from:
        description: "Docker build cache source"
        type: string
        default: "type=gha"
      cache-to:
        description: "Docker build cache destination"
        type: string
        default: "type=gha,mode=max"
    secrets:
      APP_ID:
        description: "GitHub App ID with access to the deployment repository"
        required: true
      APP_PRIVATE_KEY:
        description: "GitHub App private key with access to the deployment repository"
        required: true
    outputs:
      image:
        description: "Full immutable image reference dispatched to the deployment repository"
        value: ${{ jobs.build.outputs.image }}

jobs:
  validate-deployment-credentials:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == inputs.deploy-ref
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment credentials
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APP_ID" || { echo "APP_ID is required"; exit 1; }
          test -n "$APP_PRIVATE_KEY" || { echo "APP_PRIVATE_KEY is required"; exit 1; }

  build:
    needs: validate-deployment-credentials
    if: always() && (needs.validate-deployment-credentials.result == 'success' || needs.validate-deployment-credentials.result == 'skipped')
    uses: ./.github/workflows/build-ghcr-image.yml
    with:
      deploy-ref: ${{ inputs.deploy-ref }}
      image-name: ${{ inputs.image-name }}
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      platforms: ${{ inputs.platforms }}
      setup-qemu: ${{ inputs.setup-qemu }}
      sha-tag-prefix: ${{ inputs.sha-tag-prefix }}
      latest-tag: ${{ inputs.latest-tag }}
      extra-tags: ${{ inputs.extra-tags }}
      labels: ${{ inputs.labels }}
      build-args: ${{ inputs.build-args }}
      target: ${{ inputs.target }}
      provenance: ${{ inputs.provenance }}
      cache-from: ${{ inputs.cache-from }}
      cache-to: ${{ inputs.cache-to }}

  dispatch:
    needs:
      - validate-deployment-credentials
      - build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == inputs.deploy-ref
    uses: ./.github/workflows/dispatch-swapps-deployment.yml
    with:
      app: ${{ inputs.app }}
      environment: ${{ inputs.environment }}
      image: ${{ needs.build.outputs.image }}
      deployment-owner: ${{ inputs.deployment-owner }}
      deployment-repo: ${{ inputs.deployment-repo }}
      deploy-ref: ${{ inputs.deploy-ref }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
