name: js-check

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to run checks against"
        type: string
        default: "22"
      check-command:
        description: "Command used to run lint/format/type checks"
        type: string
        default: "pnpm lint && pnpm format:check && pnpm exec tsc -b"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Checks
        run: ${{ inputs.check-command }}
