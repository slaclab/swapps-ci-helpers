# Builds the documentation on every pull request to catch errors early, and
# publishes it to GitHub Pages whenever changes land on main.

name: Build & Deploy Documentation

on:
  workflow_call:
    inputs:
      docs-group:
        description: "uv dependency group to sync for building the docs"
        type: string
        default: "docs"
      docs-tool:
        description: "Doc build tool: \"zensical\" or \"mkdocs\""
        type: string
        default: "zensical"

jobs:
  build:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version-file: pyproject.toml

      - name: Install Dependencies
        run: uv sync --locked --group ${{ inputs.docs-group }}

      - name: Build Docs (zensical)
        if: inputs.docs-tool == 'zensical'
        run: uv run zensical build --clean --strict

      - name: Build Docs (mkdocs)
        if: inputs.docs-tool == 'mkdocs'
        run: uv run mkdocs build --strict --verbose

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    permissions:
      pages: write
      id-token: write
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
