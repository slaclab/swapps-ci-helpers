name: python-pre-commit

on:
  workflow_call: {}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      # Run pre-commit directly via uvx rather than pre-commit/action: that
      # action pulls in actions/cache by a floating tag, which the org's
      # SHA-pinning policy rejects as an unpinned transitive dependency.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure
