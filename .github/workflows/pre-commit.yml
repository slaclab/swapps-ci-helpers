name: pre-commit

on:
  workflow_call: {}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      # Run pre-commit directly via uvx rather than pre-commit/action: that
      # action pulls in actions/cache by a floating tag, which the org's
      # SHA-pinning policy rejects as an unpinned transitive dependency.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure
