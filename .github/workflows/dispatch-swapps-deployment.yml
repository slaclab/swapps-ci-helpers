name: dispatch-swapps-deployment

on:
  workflow_call:
    inputs:
      app:
        description: "App name in the deployment repository"
        type: string
        required: true
      environment:
        description: "Deployment environment to update"
        type: string
        default: "dev"
      image:
        description: "Immutable full image reference to deploy"
        type: string
        required: true
      deployment-owner:
        description: "Owner of the repository that receives the deploy-image dispatch"
        type: string
        default: ""
      deployment-repo:
        description: "Repository that receives the deploy-image dispatch"
        type: string
        default: "swapps-deployment"
      deploy-ref:
        description: "Git ref that is allowed to dispatch deployments"
        type: string
        default: "refs/heads/main"
    secrets:
      APP_ID:
        description: "GitHub App ID with access to the deployment repository"
        required: true
      APP_PRIVATE_KEY:
        description: "GitHub App private key with access to the deployment repository"
        required: true
    outputs:
      image:
        description: "Immutable full image reference dispatched to the deployment repository"
        value: ${{ jobs.dispatch.outputs.image }}

jobs:
  dispatch:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == inputs.deploy-ref
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.validate.outputs.image }}
    steps:
      - name: Validate deployment request
        id: validate
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          test -n "$APP_ID" || { echo "APP_ID is required"; exit 1; }
          test -n "$APP_PRIVATE_KEY" || { echo "APP_PRIVATE_KEY is required"; exit 1; }
          [[ "$IMAGE" =~ @sha256:[0-9a-f]{64}$ || "$IMAGE" =~ :[[:alnum:]_.-]*[0-9a-f]{7,40}$ ]] ||
            { echo "image must use an immutable SHA digest or SHA tag"; exit 1; }
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Mint deployment repo token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ inputs.deployment-owner || github.repository_owner }}
          repositories: ${{ inputs.deployment-repo }}

      - name: Dispatch deploy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP: ${{ inputs.app }}
          ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_OWNER: ${{ inputs.deployment-owner || github.repository_owner }}
          DEPLOYMENT_REPO: ${{ inputs.deployment-repo }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          gh api "repos/${DEPLOYMENT_OWNER}/${DEPLOYMENT_REPO}/dispatches" \
            -f event_type=deploy-image \
            -f "client_payload[app]=${APP}" \
            -f "client_payload[environment]=${ENVIRONMENT}" \
            -f "client_payload[image]=${IMAGE}"
