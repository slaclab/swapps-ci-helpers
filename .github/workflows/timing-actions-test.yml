name: Test timing actions

on:
  pull_request:
    paths:
      - "timing/**"
      - ".github/workflows/timing-actions-test.yml"
  push:
    branches: [main]
    paths:
      - "timing/**"
      - ".github/workflows/timing-actions-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: resolve.sh unit tests
        run: bash timing/resolve-release-latest/test_resolve.sh
      - name: Shellcheck scripts and inline steps
        run: uv run timing/tests/lint_actions.py
      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint .github/workflows/timing-actions-test.yml
      # Low findings are self-repository ($/ syntax needs a newer runner) and
      # superfluous-actions; gate on medium and above.
      - name: zizmor
        run: uvx zizmor==1.31.1 --offline --min-severity medium timing .github/workflows/timing-actions-test.yml

  resolve-release-latest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: R1.3.0, current: R1.2.9, latest: "true", pre: "false" }
          - { tag: R1.2.9, current: R1.10.0, latest: "false", pre: "false" }
          - { tag: R1.0.0, current: none, latest: "true", pre: "false" }
          - { tag: R2.0.0-alpha.1, current: R1.0.0, latest: "false", pre: "true" }
          # No override: queries this repository's real latest release (v*).
          - { tag: v999.0.0, prefix: v, pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$', latest: "true", pre: "false" }
          - { tag: v0.0.1, prefix: v, pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$', latest: "false", pre: "false" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: resolve
        uses: ./timing/resolve-release-latest
        with:
          tag: ${{ matrix.tag }}
          tag-prefix: ${{ matrix.prefix || 'R' }}
          tag-pattern: ${{ matrix.pattern || '^R[0-9]+\.[0-9]+\.[0-9]+$' }}
          current-latest: ${{ matrix.current }}
      - name: Check outputs
        env:
          GOT_LATEST: ${{ steps.resolve.outputs.make_latest }}
          GOT_PRE: ${{ steps.resolve.outputs.prerelease }}
          WANT_LATEST: ${{ matrix.latest }}
          WANT_PRE: ${{ matrix.pre }}
        run: |
          echo "make_latest=$GOT_LATEST prerelease=$GOT_PRE"
          test "$GOT_LATEST" = "$WANT_LATEST"
          test "$GOT_PRE" = "$WANT_PRE"

  setup-private-git:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: windows-latest }
          - { os: ubuntu-latest, container: "rockylinux:9" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - if: ${{ matrix.container }}
        run: dnf install -y git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./timing/setup-private-git
        with:
          token: dummy-token
          host: git.example.com
      - name: Check URL rewrite
        shell: bash
        run: |
          got=$(git config --global --get "url.https://x-access-token:dummy-token@git.example.com/.insteadOf")
          test "$got" = "https://git.example.com/"
      - id: empty
        continue-on-error: true
        uses: ./timing/setup-private-git
        with:
          token: ""
      - name: Check an empty token fails
        if: ${{ steps.empty.outcome != 'failure' }}
        shell: bash
        run: exit 1

  pytest-coverage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: helpers
          persist-credentials: false
      # The actions run in the workspace root, like a consumer repo.
      - shell: bash
        run: cp -R helpers/timing/tests/fixture/. .
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: ./helpers/timing/pytest-coverage
      - id: failing
        continue-on-error: true
        uses: ./helpers/timing/pytest-coverage
        env:
          FIXTURE_FAIL: "1"
        with:
          artifact-suffix: ${{ runner.os }}-failing
          step-summary: "true"
      - name: Check a test failure fails the step
        if: ${{ steps.failing.outcome != 'failure' }}
        shell: bash
        run: exit 1
      # "not forced" must reach pytest as one argument to deselect the failure.
      - uses: ./helpers/timing/pytest-coverage
        env:
          FIXTURE_FAIL: "1"
        with:
          artifact-suffix: ${{ runner.os }}-args
          pytest-args: |
            -k
            not forced

  coverage-artifacts:
    needs: pytest-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Check every coverage file was uploaded
        run: |
          ls -la
          for os in Linux macOS Windows; do
            test -s ".coverage.$os"
            test -s ".coverage.$os-failing"
            test -s ".coverage.$os-args"
          done

  pyinstaller-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: helpers
          persist-credentials: false
      - shell: bash
        run: cp -R helpers/timing/tests/fixture/. .
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - id: build
        uses: ./helpers/timing/pyinstaller-build
        with:
          spec: fixture.spec
          dependency-group: build
          executables: |
            fixture_cli
            fixture_gui
          artifact-name: fixture-${{ runner.os }}
      - name: Check paths output
        shell: bash
        env:
          PATHS: ${{ steps.build.outputs.paths }}
        run: |
          printf '%s\n' "$PATHS"
          test "$(grep -c . <<< "$PATHS")" = 2
      # The windowed executable is the case Start-Process exists for on Windows.
      - id: failing
        continue-on-error: true
        uses: ./helpers/timing/pyinstaller-build
        with:
          spec: fixture.spec
          dependency-group: build
          executables: fixture_gui
          smoke-test-args: --fail
          artifact-name: fixture-${{ runner.os }}-failing
      # Covers argument quoting, including Start-Process on Windows.
      - uses: ./helpers/timing/pyinstaller-build
        with:
          spec: fixture.spec
          dependency-group: build
          executables: |
            fixture_cli
            fixture_gui
          smoke-test-args: |
            --expect
            say "hi" now
          artifact-name: fixture-${{ runner.os }}-args
      - name: Check a failing smoke test fails the step
        if: ${{ steps.failing.outcome != 'failure' }}
        shell: bash
        run: exit 1
      - shell: bash
        run: rm -rf dist build
      - id: spec-args
        uses: ./helpers/timing/pyinstaller-build
        with:
          spec: fixture.spec
          spec-args: |
            --
            --console-only
          dependency-group: build
          executables: fixture_cli
          artifact-name: fixture-${{ runner.os }}-console-only
      - name: Check spec-args reached the spec
        shell: bash
        run: |
          ls dist
          test ! -e dist/fixture_gui && test ! -e dist/fixture_gui.exe
