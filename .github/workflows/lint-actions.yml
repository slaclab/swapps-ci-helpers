name: Lint actions

# Static analysis for every workflow and composite action in the repo:
#   - actionlint: workflow syntax, expression, and inline-shell (shellcheck) checks
#   - zizmor:     security audit of workflows and actions (medium severity and up)
#
# Both tools are pinned and run via uvx. zizmor runs offline (no network calls
# to GitHub) so it needs no token and cannot be rate-limited.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/**"
      - "timing/**/action.yml"
      - "timing/**/action.yaml"
      - "**/*.sh"
      - ".github/workflows/lint-actions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint + zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint

      - name: zizmor
        # Audit workflows and the composite actions. Offline so no token is
        # needed; medium severity and up, matching the project's bar.
        run: uvx zizmor==1.31.1 --offline --min-severity medium .github/workflows timing
