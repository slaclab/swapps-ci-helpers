[project]
name = "timing-actions-fixture"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["coverage", "pytest"]
build = ["pyinstaller"]

[tool.uv]
package = false

[tool.coverage.run]
relative_files = true

[tool.pytest.ini_options]
# CI checks this repo out under the workspace; don't collect that copy too.
testpaths = ["test_fixture_app.py"]
